<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="HTML element diagram">
  <defs>
    <!-- arrow marker -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/>
    </marker>

    <!-- small arrow for split -->
    <marker id="arrow-small" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#1f6f8b"/>
    </marker>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="#f4fbfb"/>

  <!-- Top ELEMENT box -->
  <g transform="translate(320,20)">
    <rect x="0" y="0" width="360" height="56" rx="4" ry="4" fill="#ffffff" stroke="#1f6f8b" stroke-width="4" filter="url(#soft)"/>
    <text x="180" y="36" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0b2b34" text-anchor="middle">ELEMENT</text>
  </g>

  <!-- vertical arrow down from ELEMENT -->
  <line x1="500" y1="76" x2="500" y2="140" stroke="#1f6f8b" stroke-width="7" marker-end="url(#arrow)"/>

  <!-- horizontal split line -->
  <line x1="220" y1="190" x2="780" y2="190" stroke="#1f6f8b" stroke-width="4"/>

  <!-- left arrow down -->
  <line x1="300" y1="190" x2="300" y2="220" stroke="#1f6f8b" stroke-width="4" marker-end="url(#arrow-small)"/>
  <!-- center arrow down -->
  <line x1="500" y1="190" x2="500" y2="220" stroke="#1f6f8b" stroke-width="4" marker-end="url(#arrow-small)"/>
  <!-- right arrow down -->
  <line x1="700" y1="190" x2="700" y2="220" stroke="#1f6f8b" stroke-width="4" marker-end="url(#arrow-small)"/>

  <!-- Labels: START TAG / CONTENT / END TAG -->
  <text x="300" y="260" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b2b34" text-anchor="middle">START TAG</text>
  <text x="500" y="260" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b2b34" text-anchor="middle">CONTENT</text>
  <text x="700" y="260" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b2b34" text-anchor="middle">END TAG</text>

  <!-- code strip background -->
  <rect x="150" y="300" width="700" height="60" rx="6" ry="6" fill="#d9f6f3"/>
  <!-- code sample text: start tag, content, end tag -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#0b2b34">
    <!-- start tag part -->
    <text x="165" y="340">&lt;p <tspan fill="#1f6f8b">class=</tspan><tspan fill="#0b9ea8">"tpt"</tspan>&gt;</text>
    <!-- content -->
    <text x="390" y="340" font-weight="700" fill="#d13a3a">This is my webpage</text>
    <!-- end tag -->
    <text x="670" y="340">&lt;/p&gt;</text>
  </g>

  <!-- curved pointers from START TAG to attribute name/value, and labels -->
  <!-- arrow from <p class="tpt"> to Attribute -->
  <path d="M220 360 C 230 400, 270 430, 210 470" stroke="#1f6f8b" stroke-width="3" fill="none" marker-end="url(#arrow-small)"/>
  <text x="60" y="470" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2b34" font-weight="600">Attribute</text>

  <!-- attribute name -->
  <path d="M260 360 C 290 390, 320 410, 305 455" stroke="#1f6f8b" stroke-width="2.5" fill="none" marker-end="url(#arrow-small)"/>
  <text x="80" y="455" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2b34">Attribute name</text>

  <!-- attribute value -->
  <path d="M320 350 C 350 380, 420 400, 420 460" stroke="#1f6f8b" stroke-width="2.5" fill="none" marker-end="url(#arrow-small)"/>
  <text x="120" y="435" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2b34">Attribute value</text>

  <!-- bracket under Attribute name/value grouping -->
  <path d="M120 480 Q 200 520, 300 480" stroke="#1f6f8b" stroke-width="2.2" fill="none"/>
  <text x="210" y="517" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2b34" text-anchor="middle">Attribute</text>

  <!-- curly bracket above content -->
  <path d="M460 320 C 470 310, 520 310, 530 320" stroke="#1f6f8b" stroke-width="3" fill="none"/>
  <text x="500" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2b34" font-weight="600" text-anchor="middle">CONTENT</text>

  <!-- small styling: underline of content (like the original) -->
  <rect x="380" y="316" width="240" height="26" rx="6" ry="6" fill="rgba(0,0,0,0)" stroke="none"/>

  <!-- subtle decoration on left -->
  <g opacity="0.08">
    <path d="M130 100 Q 250 60, 320 140 T 460 150" fill="none" stroke="#0b9ea8" stroke-width="90" />
  </g>
</svg>
